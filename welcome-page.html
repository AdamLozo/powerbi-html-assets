<!DOCTYPE html>
<html>
<head>
    <link href='https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;600&display=swap' rel='stylesheet'>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1920px; height: 1080px;
            background: linear-gradient(135deg, #1a252f 0%, #0d1117 50%, #1a252f 100%);
            font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column;
            overflow: hidden; position: relative; padding: 60px 80px;
        }
        .network-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.4; }
        .node { fill: #FF7A59; animation: pulse 3s ease-in-out infinite; }
        .node:nth-child(odd) { animation-delay: 0s; }
        .node:nth-child(even) { animation-delay: 1.5s; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.2); } }
        .connection { stroke: #FF7A59; stroke-width: 1; opacity: 0.2; animation: glow 4s ease-in-out infinite; }
        .connection:nth-child(3n) { animation-delay: 0s; }
        .connection:nth-child(3n+1) { animation-delay: 1.3s; }
        .connection:nth-child(3n+2) { animation-delay: 2.6s; }
        @keyframes glow { 0%, 100% { opacity: 0.1; stroke-width: 1; } 50% { opacity: 0.4; stroke-width: 2; } }
        .orb { position: absolute; border-radius: 50%; filter: blur(80px); animation: orbFloat 12s ease-in-out infinite; }
        .orb-1 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(255,122,89,0.15) 0%, transparent 70%); top: -200px; left: -200px; }
        .orb-2 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(138,99,210,0.12) 0%, transparent 70%); bottom: -150px; right: -150px; animation-delay: 4s; }
        .orb-3 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(255,122,89,0.1) 0%, transparent 70%); top: 50%; right: 5%; animation-delay: 8s; }
        @keyframes orbFloat { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(30px, -20px) scale(1.05); } 66% { transform: translate(-20px, 30px) scale(0.95); } }
        .logo-container { z-index: 10; margin: 20px 0 30px 20px; }
        .logo { width: 350px; opacity: 0; animation: logoReveal 2s cubic-bezier(0.16, 1, 0.3, 1) forwards; filter: drop-shadow(0 0 30px rgba(138,99,210,0.3)); }
        @keyframes logoReveal { 0% { opacity: 0; transform: translateX(-60px) scale(0.9); } 100% { opacity: 1; transform: translateX(0) scale(1); } }
        .content { text-align: center; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; }
        .title { font-family: 'Dancing Script', cursive; font-size: 110px; background: linear-gradient(135deg, #FF7A59 0%, #FF9A7A 50%, #FF7A59 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 25px; opacity: 0; animation: titleReveal 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards, shimmer 3s linear infinite; animation-delay: 0.6s, 2.4s; }
        @keyframes titleReveal { 0% { opacity: 0; transform: translateY(40px); letter-spacing: -5px; } 100% { opacity: 1; transform: translateY(0); letter-spacing: 0; } }
        @keyframes shimmer { 0% { background-position: 200% center; } 100% { background-position: -200% center; } }
        .subtitle { font-size: 32px; font-weight: 300; color: #ffffff; letter-spacing: 12px; text-transform: uppercase; margin-bottom: 35px; opacity: 0; animation: subtitleReveal 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: 1.4s; }
        @keyframes subtitleReveal { 0% { opacity: 0; transform: translateY(30px); letter-spacing: 30px; } 100% { opacity: 1; transform: translateY(0); letter-spacing: 12px; } }
        .line-container { position: relative; width: 500px; height: 6px; margin-bottom: 35px; }
        .line { position: absolute; left: 50%; width: 0; height: 2px; background: linear-gradient(90deg, transparent, #FF7A59 20%, #FF7A59 80%, transparent); animation: drawLine 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: 2.2s; transform: translateX(-50%); }
        .line::before, .line::after { content: ''; position: absolute; top: 50%; width: 8px; height: 8px; background: #FF7A59; border-radius: 50%; transform: translateY(-50%); box-shadow: 0 0 15px #FF7A59; }
        .line::before { left: 0; } .line::after { right: 0; }
        @keyframes drawLine { 0% { width: 0; } 100% { width: 500px; } }
        .tagline { font-size: 22px; font-weight: 400; color: rgba(255, 255, 255, 0.7); letter-spacing: 3px; opacity: 0; animation: fadeUp 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: 2.8s; }
        @keyframes fadeUp { 0% { opacity: 0; transform: translateY(25px); } 100% { opacity: 1; transform: translateY(0); } }
        .footer { position: absolute; bottom: 50px; left: 0; right: 0; text-align: center; font-size: 14px; color: rgba(255, 255, 255, 0.4); letter-spacing: 6px; text-transform: uppercase; opacity: 0; animation: fadeUp 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: 3.4s; z-index: 10; }
        .scanline { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, transparent, rgba(255,122,89,0.4), transparent); animation: scan 4s linear infinite; animation-delay: 4s; z-index: 5; opacity: 0; }
        @keyframes scan { 0% { top: 0; opacity: 0; } 5% { opacity: 0.6; } 95% { opacity: 0.6; } 100% { top: 100%; opacity: 0; } }
    </style>
</head>
<body>
    <div class='orb orb-1'></div><div class='orb orb-2'></div><div class='orb orb-3'></div>
    <div class='scanline'></div>
    <svg class='network-bg' viewBox='0 0 1920 1080'>
        <line class='connection' x1='100' y1='150' x2='350' y2='280'/><line class='connection' x1='350' y1='280' x2='250' y2='500'/><line class='connection' x1='250' y1='500' x2='150' y2='750'/><line class='connection' x1='150' y1='750' x2='400' y2='900'/><line class='connection' x1='350' y1='280' x2='600' y2='200'/><line class='connection' x1='600' y1='200' x2='850' y2='350'/><line class='connection' x1='850' y1='350' x2='700' y2='550'/><line class='connection' x1='700' y1='550' x2='500' y2='700'/><line class='connection' x1='500' y1='700' x2='400' y2='900'/><line class='connection' x1='1820' y1='100' x2='1600' y2='250'/><line class='connection' x1='1600' y1='250' x2='1750' y2='450'/><line class='connection' x1='1750' y1='450' x2='1550' y2='600'/><line class='connection' x1='1550' y1='600' x2='1700' y2='800'/><line class='connection' x1='1700' y1='800' x2='1500' y2='950'/><line class='connection' x1='1600' y1='250' x2='1350' y2='180'/><line class='connection' x1='1350' y1='180' x2='1150' y2='320'/><line class='connection' x1='1150' y1='320' x2='1300' y2='500'/><line class='connection' x1='1300' y1='500' x2='1550' y2='600'/><line class='connection' x1='850' y1='350' x2='1150' y2='320'/><line class='connection' x1='700' y1='550' x2='1300' y2='500'/>
        <circle class='node' cx='100' cy='150' r='6'/><circle class='node' cx='350' cy='280' r='8'/><circle class='node' cx='250' cy='500' r='5'/><circle class='node' cx='150' cy='750' r='7'/><circle class='node' cx='400' cy='900' r='6'/><circle class='node' cx='600' cy='200' r='7'/><circle class='node' cx='850' cy='350' r='9'/><circle class='node' cx='700' cy='550' r='6'/><circle class='node' cx='500' cy='700' r='5'/><circle class='node' cx='1820' cy='100' r='6'/><circle class='node' cx='1600' cy='250' r='8'/><circle class='node' cx='1750' cy='450' r='5'/><circle class='node' cx='1550' cy='600' r='7'/><circle class='node' cx='1700' cy='800' r='6'/><circle class='node' cx='1500' cy='950' r='5'/><circle class='node' cx='1350' cy='180' r='6'/><circle class='node' cx='1150' cy='320' r='8'/><circle class='node' cx='1300' cy='500' r='6'/>
    </svg>
    <div class='logo-container'>
        <img src='https://raw.githubusercontent.com/AdamLozo/powerbi-html-assets/main/AVIZ-Logo-lightblue.png' alt='Aviz Networks' class='logo'>
    </div>
    <div class='content'>
        <div class='title'>Hubspot Report</div>
        <div class='subtitle'>Analytics Dashboard</div>
        <div class='line-container'><div class='line'></div></div>
        <div class='tagline'>Marketing & Sales Performance Insights</div>
    </div>
    <div class='footer'>Powered by Aviz Networks</div>
</body>
</html>
