<!DOCTYPE html>
<html>
<head>
    <link href='https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;600&display=swap' rel='stylesheet'>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            width: 1920px;
            height: 1080px;
            background: linear-gradient(135deg, #33475B 0%, #1a252f 100%);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            overflow: hidden;
            position: relative;
            padding: 60px 80px;
        }
        
        /* Floating background circles */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 8s ease-in-out infinite;
        }
        
        .bg-circle:nth-child(1) {
            width: 600px;
            height: 600px;
            background: #FF7A59;
            top: -200px;
            right: -100px;
            animation-delay: 0s;
        }
        
        .bg-circle:nth-child(2) {
            width: 400px;
            height: 400px;
            background: #00BDA5;
            bottom: -100px;
            left: -100px;
            animation-delay: 2s;
        }
        
        .bg-circle:nth-child(3) {
            width: 300px;
            height: 300px;
            background: #FF7A59;
            top: 50%;
            left: 60%;
            animation-delay: 4s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Logo container - top left */
        .logo-container {
            z-index: 10;
            margin: 20px 0 30px 20px;
        }
        
        .logo {
            width: 350px;
            height: auto;
            opacity: 0;
            animation: slideInLeft 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.3s;
        }
        
        /* Main content - centered */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            z-index: 10;
        }
        
        /* Title styling */
        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 120px;
            font-weight: 700;
            color: #FF7A59;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeUp 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.8s;
            text-shadow: 0 4px 30px rgba(255, 122, 89, 0.3);
        }
        
        /* Subtitle */
        .subtitle {
            font-size: 28px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 12px;
            text-transform: uppercase;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeIn 1.5s ease forwards;
            animation-delay: 1.5s;
        }
        
        /* Decorative line */
        .line {
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #FF7A59, transparent);
            margin-bottom: 40px;
            animation: expandLine 1s ease forwards;
            animation-delay: 2.5s;
        }
        
        @keyframes expandLine {
            to { width: 400px; }
        }
        
        /* Tagline */
        .tagline {
            font-size: 24px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 2px;
            opacity: 0;
            animation: fadeIn 1.5s ease forwards;
            animation-delay: 3s;
        }
        
        /* Aviz Networks footer */
        .footer {
            position: absolute;
            bottom: 50px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 6px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 3.4s;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class='bg-circle'></div>
    <div class='bg-circle'></div>
    <div class='bg-circle'></div>
    
    <div class='logo-container'>
        <img src='https://raw.githubusercontent.com/AdamLozo/powerbi-html-assets/main/AVIZ-Logo-lightblue.png' alt='Aviz Networks' class='logo'>
    </div>
    
    <div class='content'>
        <div class='title'>Hubspot Report</div>
        <div class='subtitle'>Analytics Dashboard</div>
        <div class='line'></div>
        <div class='tagline'>Marketing & Sales Performance Insights</div>
    </div>
    
    <div class='footer'>Powered by Aviz Networks</div>
</body>
</html>
